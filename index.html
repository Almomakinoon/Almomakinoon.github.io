<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مين الأصلي؟ | الممكنون</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ead8cf;
      --navy: #062f3d;
      --navy-light: #0f4b5f;
      --white: rgba(255,255,255,0.72);
      --gold: #d7b47a;
      --danger: #c85b5b;
      --success: #1f7a5a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.25), transparent 35%),
        radial-gradient(circle at bottom left, rgba(6,47,61,0.06), transparent 35%),
        var(--bg);
      color: var(--navy);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-pattern {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image:
        linear-gradient(var(--navy) 1px, transparent 1px),
        linear-gradient(90deg, var(--navy) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 6vw;
      border-bottom: 1px solid rgba(6,47,61,0.08);
      backdrop-filter: blur(6px);
    }

    .header-logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .header-badge {
      background: rgba(6,47,61,0.08);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
    }

    .container {
      width: min(1200px, 92vw);
      margin: auto;
      padding: 35px 0 50px;
    }

    .hero {
      text-align: center;
      padding: 35px 0 20px;
    }

    .hero-brand {
      font-size: clamp(80px, 16vw, 220px);
      line-height: 0.82;
      font-weight: 900;
      letter-spacing: -8px;
      margin: 0;
      color: var(--navy);
      text-shadow: 0 8px 30px rgba(6,47,61,0.08);
    }

    .hero-tagline {
      margin-top: 18px;
      font-size: clamp(18px, 2.5vw, 32px);
      color: var(--navy-light);
      opacity: 0.85;
    }

    .quiz-card {
      margin-top: 35px;
      background: rgba(255,255,255,0.38);
      border: 1px solid rgba(255,255,255,0.45);
      backdrop-filter: blur(14px);
      border-radius: 34px;
      padding: 35px;
      box-shadow: 0 25px 60px rgba(6,47,61,0.08);
    }

    .quiz-top {
      text-align: center;
      margin-bottom: 28px;
    }

    .mini-label {
      display: inline-block;
      background: rgba(6,47,61,0.08);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 78px);
    }

    .sub {
      margin-top: 8px;
      font-size: 18px;
      opacity: 0.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 30px;
    }

    .option {
      position: relative;
      border-radius: 28px;
      padding: 28px 16px;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(255,255,255,0.55);
      border: 2px solid transparent;
      cursor: pointer;
      transition: 0.3s ease;
      overflow: hidden;
    }

    .option::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent);
      opacity: 0;
      transition: 0.3s;
    }

    .option:hover::before {
      opacity: 1;
    }

    .option:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: rgba(6,47,61,0.15);
      box-shadow: 0 20px 40px rgba(6,47,61,0.12);
    }

    .choice-label {
      position: absolute;
      top: 12px;
      left: 14px;
      font-size: 14px;
      font-weight: 800;
      opacity: 0.35;
    }

    .logo {
      font-size: clamp(34px, 4vw, 56px);
      font-weight: 900;
      color: var(--navy);
      letter-spacing: -2px;
      z-index: 2;
    }

    .fake1 { transform: skew(-7deg); }
    .fake2 { letter-spacing: 1px; }
    .fake3 { transform: rotate(-2deg); opacity: 0.8; }

    .message {
      text-align: center;
      min-height: 38px;
      margin-top: 24px;
      font-size: 22px;
      font-weight: 700;
    }

    .wrong {
      color: var(--danger);
    }

    .shake {
      animation: shake 0.35s;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(8px); }
      50% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .video-screen {
      display: none;
      width: min(1000px, 92vw);
      margin: 40px auto;
      text-align: center;
      background: rgba(255,255,255,0.45);
      border-radius: 34px;
      padding: 30px;
      box-shadow: 0 25px 60px rgba(6,47,61,0.1);
    }

    .video-screen h2 {
      font-size: clamp(40px, 6vw, 90px);
      margin: 0 0 10px;
    }

    .video-screen p {
      margin-bottom: 22px;
      font-size: 20px;
    }

    video {
      width: 100%;
      border-radius: 24px;
      background: black;
    }

    .actions {
      margin-top: 22px;
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      padding: 14px 26px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-size: 17px;
      font-weight: 800;
      transition: 0.25s;
    }

    .primary {
      background: var(--navy);
      color: white;
    }

    .secondary {
      background: rgba(6,47,61,0.08);
      color: var(--navy);
    }

    button:hover {
      transform: translateY(-3px);
    }

    footer {
      margin-top: 40px;
      padding: 24px 6vw 40px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-top: 1px solid rgba(6,47,61,0.08);
      font-size: 14px;
      opacity: 0.75;
    }

    .confetti {
      position: fixed;
      font-size: 28px;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 560px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header,
      footer {
        text-align: center;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="bg-pattern"></div>

  <header>
    <div class="header-logo">الممكنون</div>
    <div class="header-badge">تحدي الهوية الأصلية</div>
  </header>

  <main class="container" id="game">
    <section class="hero">
      <h2 class="hero-brand">الممكنون</h2>
      <div class="hero-tagline">نمكن أنفسنا حتى نمكن الآخرين</div>
    </section>

    <section class="quiz-card">
      <div class="quiz-top">
        <div class="mini-label">اختبر نظرك 👀</div>
        <h1>مين الأصلي؟</h1>
        <div class="sub">اختَر الشعار الصحيح وافتح المفاجأة</div>
      </div>

      <div class="grid">
        <div class="option" onclick="checkAnswer(this,false)">
          <span class="choice-label">A</span>
          <div class="logo"><img src="/logos/1.png"></div>
        </div>

        <div class="option" onclick="checkAnswer(this,false)">
          <span class="choice-label">B</span>
          <div class="logo fake2">الممكنين</div>
        </div>

        <div class="option" onclick="checkAnswer(this,true)">
          <span class="choice-label">C</span>
          <div class="logo">الممكنون</div>
        </div>

        <div class="option" onclick="checkAnswer(this,false)">
          <span class="choice-label">D</span>
          <div class="logo fake3">المُمكنون</div>
        </div>
      </div>

      <div class="message" id="message"></div>
    </section>
  </main>

  <section class="video-screen" id="videoScreen">
    <h2>صح عليك 🎉</h2>
    <p>عرفت الأصلي… الآن شوف المفاجأة</p>

    <video controls autoplay>
      <source src="your-video.mp4" type="video/mp4">
      المتصفح لا يدعم تشغيل الفيديو.
    </video>

    <div class="actions">
      <button class="primary" onclick="restartGame()">جرّب مرة ثانية</button>
      <button class="secondary" onclick="shareGame()">شارك التحدي</button>
    </div>
  </section>

  <footer>
    <div>© 2026 الممكنون — تجربة تفاعلية</div>
    <div>صُممت للإبداع، التفاعل، والانطباع الأول</div>
  </footer>

  <script>
    function checkAnswer(card, isCorrect) {
      var message = document.getElementById("message");

      if (isCorrect) {
        document.getElementById("game").style.display = "none";
        document.getElementById("videoScreen").style.display = "block";
        launchConfetti();
      } else {
        message.innerHTML = '<span class="wrong">قريب... بس مو الأصلي 😏 جرّب ثانية</span>';
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
      }
    }

    function restartGame() {
      document.getElementById("videoScreen").style.display = "none";
      document.getElementById("game").style.display = "block";
      document.getElementById("message").innerHTML = "";
    }

    function shareGame() {
      alert("انسخ الرابط وشارك التحدي 😎");
    }

    function launchConfetti() {
      var emojis = ["🎉","✨","🔥","🎊"];
      for (var i = 0; i < 30; i++) {
        var confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.top = "-20px";
        confetti.style.animationDuration = (2 + Math.random() * 3) + "s";
        document.body.appendChild(confetti);

        setTimeout((function(el) {
          return function() {
            el.remove();
          };
        })(confetti), 5000);
      }
    }
  </script>
</body>
</html>
